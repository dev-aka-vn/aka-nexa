<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submission - Read-Only View</title>
    <link rel="stylesheet" href="https://cdn.form.io/js/formio.full.min.css" />
    <style>
      :root {
        --color-bg: #f8fafc;
        --color-surface: #ffffff;
        --color-text: #0f172a;
        --color-border: #e2e8f0;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        line-height: 1.5;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
      }
      .card-header {
        padding: 1.5rem 1.5rem 0;
      }
      .card-body {
        padding: 1.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
      }
      .metadata {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: #475569;
      }
      #formio-readonly {
        margin-top: 1rem;
      }
      .loading {
        padding: 2rem;
        text-align: center;
        color: #475569;
      }
      .error {
        padding: 1rem;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 6px;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <header class="card-header">
          <h1>Submission (Read-Only)</h1>
          <div class="metadata" id="metadata"></div>
        </header>
        <section class="card-body">
          <div id="status" class="loading">Loading read-only submission...</div>
          <div id="formio-readonly"></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.form.io/js/formio.full.min.js"></script>
    <script type="module" src="./view.browser.ts"></script>
  </body>
</html>
