<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit submission</title>
    <style>
      /* Design tokens: mockup :root set (prototypes/mockup.html lines 47–84).
         AGENTS.md rule 1 — reuse, never a second palette.
         FormIO CSS is bundled same-origin from the npm entrypoint (FRM-07);
         no remote CDN asset is referenced. */
      :root {
        --ink: #0e1420;
        --canvas: #f6f8fa;
        --surface: #ffffff;
        --surface-2: #f0f3f7;
        --line: #e2e8f0;
        --line-strong: #cbd5e1;
        --text: #101828;
        --text-2: #475467;
        --muted: #667085;
        --accent: #0f9d8f;
        --accent-strong: #0b7d72;
        --accent-soft: #e4f5f2;
        --amber: #b7791f;
        --amber-soft: #fdf5e6;
        --red: #c0392b;
        --red-soft: #fdecea;
        --green: #2f855a;
        --green-soft: #e8f5ee;
        --blue: #2b6cb0;
        --blue-soft: #eaf2fb;
        --radius-xs: 6px;
        --radius: 8px;
        --radius-lg: 12px;
        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
        --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.55;
        color: var(--text);
        background: var(--canvas);
        -webkit-font-smoothing: antialiased;
      }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
      .view { max-width: 900px; margin: 0 auto; padding: 26px 28px 64px; }
      .page-head { margin-bottom: 22px; }
      .page-head h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 25px; line-height: 1.2; }
      .page-head .sub { color: var(--muted); font-size: 14px; margin-top: 5px; }
      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
      }
      .card-body { padding: 18px; }
      .callout { display: flex; gap: 11px; padding: 13px 15px; border-radius: var(--radius); font-size: 13.5px; }
      .callout-accent { background: var(--accent-soft); color: var(--accent-strong); }
      .callout-warn { background: var(--amber-soft); color: #7a4f0d; }
      .callout-danger { background: var(--red-soft); color: #8f271b; }
      .callout p { margin: 0; }
      #edit-ack { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      #edit-ack form { margin: 0; }
      .footer { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 9px 15px; border-radius: var(--radius); border: 1px solid var(--line-strong);
        background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500;
        cursor: pointer; white-space: nowrap; min-height: 40px; text-decoration: none;
      }
      .btn:hover { background: var(--surface-2); border-color: var(--muted); }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: #03211e; font-weight: 600; }
      .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
      .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
      .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
      .btn.is-loading { color: transparent !important; position: relative; pointer-events: none; }
      .btn.is-loading::after {
        content: ""; position: absolute; width: 15px; height: 15px; border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.25); border-top-color: currentColor;
        color: var(--text); animation: spin 0.7s linear infinite;
      }
      .btn-primary.is-loading::after { border-color: rgba(255, 255, 255, 0.4); border-top-color: #fff; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pill-mono {
        font-family: var(--mono); font-size: 12px; background: var(--surface-2);
        border: 1px solid var(--line); padding: 2px 7px; border-radius: var(--radius-xs);
        color: var(--text-2); word-break: break-all;
      }
      #edit-confirmation {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 22px;
        overflow-wrap: anywhere;
      }
      #edit-confirmation h2 { margin: 0 0 8px; font-family: var(--display); font-size: 18px; }
      #edit-confirmation p { margin: 0 0 8px; }
      #edit-confirmation .note { color: var(--muted); }
      #edit-confirmation .meta { color: var(--text-2); font-size: 13.5px; }
      #formio-edit { margin-top: 14px; }
      .loading { padding: 2rem; text-align: center; color: var(--muted); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body data-connector="Connector">
    <main class="view">
      <div class="page-head">
        <h1>Edit submission</h1>
        <div class="sub" id="edit-sub"></div>
      </div>

      <section class="card" id="edit-card">
        <div class="card-body">
          <div class="callout callout-danger" id="edit-error" role="alert" hidden></div>
          <div id="edit-status" class="loading">Loading the latest revision...</div>
          <div id="formio-edit"></div>

          <div class="callout callout-accent" id="edit-ack" role="alertdialog" hidden>
            <p id="edit-ack-text"></p>
            <div id="edit-ack-actions">
              <button type="button" class="btn btn-primary" id="edit-ack-continue">Continue</button>
              <button type="button" class="btn btn-ghost" id="edit-ack-cancel">Go back</button>
            </div>
          </div>

          <div class="footer">
            <button type="button" class="btn btn-primary" id="edit-submit">Submit correction</button>
            <button type="button" class="btn btn-ghost" id="edit-discard">Discard changes</button>
          </div>
        </div>
      </section>

      <section id="edit-confirmation" hidden></section>
    </main>

    <script type="module">
      import { initEdit, parseEditLinkUrl } from './edit.ts';

      const params = new URLSearchParams(window.location.search);
      const parsed = parseEditLinkUrl(window.location.pathname + window.location.search);
      const token = params.get('token') || parsed?.token || '';
      const jti =
        parsed?.jti ||
        (window.location.pathname.split('/l/edit/')[1] || '').split('?')[0] ||
        params.get('jti') ||
        '';
      const apiOrigin = window.location.origin.replace('renderer', 'api') || window.location.origin;

      initEdit({ apiOrigin, jti, token });
    </script>
  </body>
</html>
