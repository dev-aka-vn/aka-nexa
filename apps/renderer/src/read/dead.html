<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Unavailable</title>
    <style>
      :root {
        --color-bg: #f8fafc;
        --color-surface: #ffffff;
        --color-text: #0f172a;
        --color-border: #e2e8f0;
        --color-danger: #991b1b;
        --color-primary: #0f9d8f;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        line-height: 1.5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
        max-width: 600px;
        padding: 2.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.75rem;
        color: var(--color-danger);
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 1.125rem;
      }
      .affordance {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        background: var(--color-primary);
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 500;
        transition: opacity 0.15s ease;
      }
      .affordance:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Link Unavailable</h1>
      <p id="message">This link is invalid or has been tampered with.</p>
      <a id="affordance" class="affordance" href="#" style="display: none;">Request a new one via IM</a>
    </main>

    <script type="module">
      import { getDenyReasonCopy } from './view.ts';
      import { ReadDenyReason } from '@akane/contract';

      const params = new URLSearchParams(window.location.search);
      const reasonParam = params.get('reason');

      let reason = ReadDenyReason.bad_signature;
      if (reasonParam) {
        if (Object.values(ReadDenyReason).includes(reasonParam as ReadDenyReason)) {
          reason = reasonParam as ReadDenyReason;
        }
      }

      const message = getDenyReasonCopy(reason);
      const el = document.getElementById('message');
      if (el) {
        el.textContent = message;
      }
      document.title = 'Link Unavailable';

      // LNK-11: show the IM affordance for actionable reasons — ones where
      // the user can self-serve by requesting a fresh link.
      const actionable = new Set<ReadDenyReason>([
        ReadDenyReason.expired,
        ReadDenyReason.consumed,
        ReadDenyReason.revoked,
        ReadDenyReason.wrong_app,
        ReadDenyReason.wrong_version,
        ReadDenyReason.bad_signature,
      ]);
      const affordanceEl = document.getElementById('affordance');
      if (affordanceEl && actionable.has(reason)) {
        affordanceEl.style.display = 'inline-block';
      }
    </script>
  </body>
</html>
