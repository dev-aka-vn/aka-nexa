@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

:root{
  --ink:#0e1420;
  --ink-2:#151d2e;
  --ink-3:#1e283c;
  --canvas:#f6f8fa;
  --surface:#ffffff;
  --surface-2:#f0f3f7;
  --line:#e2e8f0;
  --line-strong:#cbd5e1;
  --text:#101828;
  --text-2:#475467;
  --muted:#667085;
  --accent:#0f9d8f;
  --accent-strong:#0b7d72;
  --accent-soft:#e4f5f2;
  --amber:#b7791f;
  --amber-soft:#fdf5e6;
  --red:#c0392b;
  --red-soft:#fdecea;
  --green:#2f855a;
  --green-soft:#e8f5ee;
  --blue:#2b6cb0;
  --blue-soft:#eaf2fb;
  --violet:#6b5bd2;
  --violet-soft:#eeebfb;
  --radius-xs:6px;
  --radius:8px;
  --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow:0 4px 14px rgba(16,24,40,.08);
  --shadow-lg:0 24px 48px rgba(16,24,40,.20);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --topbar-h:60px;
  --side-w:250px;
  --od-gap:8px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  color:var(--text);
  background:var(--canvas);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.01em;color:var(--text)}
p{margin:0}
a{color:var(--accent-strong)}
button{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--radius);transition:top .15s ease}
.skip:focus{top:8px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;vertical-align:-.14em;flex:none}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--side-w);
  background:var(--ink);color:#c7d1e0;
  display:flex;flex-direction:column;z-index:60;
  border-right:1px solid #0a0f18;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(160deg,#14b8a6,#0f7d72);display:grid;place-items:center;flex:none}
.brand .mark svg{width:18px;height:18px;stroke:#062a26}
.brand b{font-family:var(--display);font-size:15px;color:#fff;font-weight:600;line-height:1.2;display:block}
.brand small{font-size:11px;color:#7d8ba3;letter-spacing:.04em;text-transform:uppercase}
.nav-scroll{overflow-y:auto;padding:14px 12px 24px;flex:1}
.nav-group{margin-bottom:18px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#5f6d85;padding:0 10px 7px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 10px;border-radius:var(--radius);border:0;background:transparent;
  color:#b7c2d4;cursor:pointer;font-size:14px;line-height:1.3;position:relative;
  transition:background .15s ease,color .15s ease;
}
.nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item[aria-current="page"]{background:rgba(15,157,143,.16);color:#fff}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item .count{margin-left:auto;font-size:11px;font-family:var(--mono);background:rgba(255,255,255,.09);padding:1px 7px;border-radius:99px;color:#9fb0c7}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#6b7a92}
.env-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#38d39f;margin-right:7px;box-shadow:0 0 0 3px rgba(56,211,159,.16)}

.main{margin-left:var(--side-w);flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;height:var(--topbar-h);
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px;
}
.hamburger{display:none}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);min-width:0;flex:1}
.crumbs b{color:var(--text);font-weight:600;font-family:var(--display);font-size:15px}
.search{position:relative;width:290px;max-width:34vw}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);pointer-events:none}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);font-size:14px}
.search input:focus{background:#fff;border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.env-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--ink);color:#c8e9e4;white-space:nowrap}
.avatar{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--line)}
.avatar .who{text-align:right;line-height:1.2}
.avatar .who b{display:block;font-size:13.5px;font-weight:600}
.avatar .who span{font-size:11.5px;color:var(--muted)}
.avatar .pic{width:36px;height:36px;border-radius:50%;background:linear-gradient(160deg,#27405c,#16283e);color:#e8f5f3;display:grid;place-items:center;font-weight:600;font-size:13px;font-family:var(--display);flex:none}

.view{flex:1;padding:26px 28px 64px;max-width:1440px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.page-head .titles{flex:1;min-width:240px}
.page-head h1{font-size:25px;line-height:1.2}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:5px;max-width:70ch}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 15px;border-radius:var(--radius);border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;
  transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease;
  white-space:nowrap;min-height:40px;
}
.btn svg{width:16px;height:16px;stroke:currentColor;flex:none}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#03211e;font-weight:600}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#a93226;border-color:#a93226}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:6px 11px;min-height:34px;font-size:13px}
.btn-sm svg{width:14px;height:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.is-loading{color:transparent !important;position:relative;pointer-events:none}
.btn.is-loading::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:currentColor;color:var(--text);animation:spin .7s linear infinite}
.btn-primary.is-loading::after{border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:40px;height:40px;padding:0;border-radius:var(--radius);border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--line)}

/* ---------- cards / stats ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h2,.card-head h3{font-size:15.5px}
.card-head .spacer{flex:1}
.card-body{padding:18px}
.card-foot{padding:14px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}

.stat-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm);display:grid;gap:3px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--display);font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.stat .d{font-size:12.5px;color:var(--muted)}
.trend-up{color:var(--green);font-weight:600}
.trend-down{color:var(--red);font-weight:600}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;line-height:1.5}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge-published{background:var(--green-soft);color:#256b48}
.badge-draft{background:var(--surface-2);color:var(--text-2)}
.badge-deprecated{background:var(--amber-soft);color:#8a5a10}
.badge-archived{background:var(--violet-soft);color:#4d3fb0}
.badge-purged{background:var(--red-soft);color:#98291d}
.badge-healthy{background:var(--green-soft);color:#256b48}
.badge-degraded{background:var(--amber-soft);color:#8a5a10}
.badge-unhealthy{background:var(--red-soft);color:#98291d}
.badge-completed{background:var(--green-soft);color:#256b48}
.badge-partial{background:var(--amber-soft);color:#8a5a10}
.badge-pending{background:var(--blue-soft);color:#1f5289}
.badge-failed{background:var(--red-soft);color:#98291d}
.badge-neutral{background:var(--surface-2);color:var(--text-2)}
.pill-mono{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);padding:2px 7px;border-radius:var(--radius-xs);color:var(--text-2)}

/* ---------- chips / rail ---------- */
.rail{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;
  padding:6px 14px;font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap;flex:none;
  transition:background .14s ease,border-color .14s ease,color .14s ease;
}
.chip:hover{border-color:var(--muted);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
thead th{
  text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:#fafcfe}
tbody tr.clickable{cursor:pointer}
.cell-strong{font-weight:600;color:var(--text)}
.cell-mono{font-family:var(--mono);font-size:12.5px;color:var(--text-2)}
.cell-actions{text-align:right;white-space:nowrap}
.cell-actions svg{width:16px;height:16px;stroke:currentColor;vertical-align:middle}
.table-wrap td > svg{width:15px;height:15px;stroke:currentColor;vertical-align:middle}
.tbl-empty{padding:48px 20px;text-align:center;color:var(--muted)}

/* ---------- forms ---------- */
.field{display:grid;gap:6px;margin-bottom:18px}
.field > label,.field .label{font-size:13.5px;font-weight:600;color:var(--text)}
.field .req{color:var(--red);margin-left:2px}
.input,.select,.textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);
  background:var(--surface);font-size:14.5px;font-family:inherit;color:var(--text);transition:border-color .14s ease,box-shadow .14s ease;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[readonly]{background:var(--surface-2);color:var(--text-2);cursor:not-allowed}
.textarea{min-height:96px;resize:vertical;line-height:1.55}
.helper{font-size:12.5px;color:var(--muted)}
.error-text{font-size:12.5px;color:var(--red);font-weight:500;display:flex;gap:5px;align-items:center}
.error-text svg{width:13px;height:13px;stroke:currentColor;flex:none}
.input.invalid,.select.invalid,.textarea.invalid{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field-row-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.radio-card{border:1px solid var(--line-strong);border-radius:var(--radius);padding:13px 15px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:border-color .14s ease,background .14s ease;background:var(--surface)}
.radio-card:hover{border-color:var(--muted)}
.radio-card input{margin-top:3px;accent-color:var(--accent)}
.radio-card.sel{border-color:var(--accent);background:var(--accent-soft)}
.radio-card .rc-t{font-weight:600;font-size:14px;display:block}
.radio-card .rc-d{font-size:12.5px;color:var(--muted);margin-top:2px;display:block}

.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:40px;height:23px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .16s ease;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .16s ease}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(17px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:22px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:transparent;padding:11px 15px;font-size:14px;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .14s ease,border-color .14s ease;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent);font-weight:600}

/* ---------- misc ---------- */
.empty{text-align:center;padding:52px 24px;color:var(--muted)}
.empty svg{width:40px;height:40px;stroke:var(--line-strong);margin-bottom:14px}
.empty h3{font-size:16px;color:var(--text);margin-bottom:6px}
.empty p{font-size:14px;max-width:44ch;margin:0 auto 16px}
.divider{height:1px;background:var(--line);margin:22px 0}
.kv{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:10px 18px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;color:var(--text)}
.code-inline{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 6px;border-radius:var(--radius-xs);color:var(--accent-strong)}
.code-block{font-family:var(--mono);font-size:12.5px;line-height:1.7;background:var(--ink);color:#c9d6e6;border-radius:var(--radius);padding:14px 16px;overflow-x:auto;white-space:pre;margin:0}
.callout{display:flex;gap:11px;padding:13px 15px;border-radius:var(--radius);font-size:13.5px;line-height:1.55;align-items:flex-start}
.callout svg{width:17px;height:17px;flex:none;stroke:currentColor;margin-top:1px}
.callout-info{background:var(--blue-soft);color:#1f5289}
.callout-warn{background:var(--amber-soft);color:#7a4f0d}
.callout-danger{background:var(--red-soft);color:#8f271b}
.callout-accent{background:var(--accent-soft);color:var(--accent-strong)}
.callout b{font-weight:600}
.stack-list{display:grid;gap:10px}
.list-row{display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:border-color .14s ease,box-shadow .14s ease}
.list-row:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.list-row .lr-main{flex:1;min-width:0}
.list-row .lr-t{font-weight:600;font-size:14px}
.list-row .lr-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.icon-tile{width:38px;height:38px;border-radius:var(--radius);display:grid;place-items:center;flex:none}
.icon-tile svg{width:19px;height:19px;stroke:currentColor}
.it-teal{background:var(--accent-soft);color:var(--accent-strong)}
.it-blue{background:var(--blue-soft);color:#1f5289}
.it-amber{background:var(--amber-soft);color:#8a5a10}
.it-red{background:var(--red-soft);color:#98291d}
.it-green{background:var(--green-soft);color:#256b48}
.it-violet{background:var(--violet-soft);color:#4d3fb0}
.it-neutral{background:var(--surface-2);color:var(--text-2)}
.meter{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:80px}
.meter span{display:block;height:100%;border-radius:99px;background:var(--accent)}
.seg-list{display:grid;gap:0}
.seg-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.seg-item:last-child{border-bottom:0}
.step-rail{display:flex;gap:0;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px}
.step .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--display);flex:none}
.step.done .dot{background:var(--green);color:#fff}
.step.now .dot{background:var(--accent);color:#03211e}
.step.todo .dot{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-strong)}
.step .lbl{font-size:13px;font-weight:600}
.step.todo .lbl{color:var(--muted)}
.step-line{width:34px;height:2px;background:var(--line);margin:0 4px;flex:none}

/* ---------- overlay: modal / drawer / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,14,22,.5);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.modal-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:22px;pointer-events:none}
.modal{
  width:min(620px,100%);max-height:88vh;background:var(--surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;pointer-events:auto;
  opacity:0;transform:translateY(10px) scale(.99);transition:opacity .18s ease,transform .18s ease;
  border:1px solid var(--line);
}
.modal.on{opacity:1;transform:none}
.modal-head{display:flex;gap:14px;padding:20px 22px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.modal-head h2{font-size:18px}
.modal-head .sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.modal-body{padding:20px 22px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius-lg) var(--radius-lg);flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:95;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.drawer-head{display:flex;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);align-items:flex-start}
.drawer-head h2{font-size:17px}
.drawer-body{padding:20px;overflow-y:auto;flex:1}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast-root{position:fixed;right:22px;bottom:22px;z-index:120;display:grid;gap:10px;max-width:360px}
.toast{display:flex;gap:11px;align-items:flex-start;background:var(--ink);color:#e8eef7;padding:13px 15px;border-radius:var(--radius);box-shadow:var(--shadow-lg);font-size:13.5px;animation:toast-in .22s ease}
.toast svg{width:17px;height:17px;flex:none;stroke:currentColor;margin-top:1px}
.toast.ok svg{stroke:#4fd6a8}
.toast.err svg{stroke:#ff8f80}
.toast b{display:block;font-weight:600;margin-bottom:1px}
.toast .tx{color:#a9b6c9}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .grid-main{grid-template-columns:1fr}
  .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1024px){
  .grid-3{grid-template-columns:1fr}
  .field-row-3{grid-template-columns:1fr 1fr}
}
@media (max-width:960px){
  :root{--side-w:0px}
  .sidebar{transform:translateX(-100%);transition:transform .22s ease;width:264px;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .hamburger{display:grid}
  .search{width:200px;max-width:38vw}
  .view{padding:20px 16px 60px}
}
@media (max-width:768px){
  .grid-2{grid-template-columns:1fr}
  .field-row,.field-row-3{grid-template-columns:1fr}
  .stat-strip{grid-template-columns:1fr 1fr;gap:12px}
  .avatar .who{display:none}
  .search{display:none}
  .page-head h1{font-size:22px}
  .toast-root{left:14px;right:14px;bottom:14px;max-width:none}
}
@media (max-width:520px){
  .stat-strip{grid-template-columns:1fr}
  .page-actions{width:100%}
  .page-actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

  /* ======================= helpers ======================= */
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  var esc = function(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  };
  function icon(name,cls){
    return '<svg class="ic'+(cls?" "+cls:"")+'" aria-hidden="true" focusable="false"><use href="#'+name+'"/></svg>';
  }
  function fmtDate(iso){
    if(!iso) return "—";
    var d=new Date(iso); if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" "+d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
  }
  function fmtNum(n){ return (n||0).toLocaleString("en-US"); }
  function statusBadge(s){
    var map={
      published:["badge-published","Published"], draft:["badge-draft","Draft"],
      deprecated:["badge-deprecated","Deprecated"], archived:["badge-archived","Archived"],
      purged:["badge-purged","Purged"], healthy:["badge-healthy","Healthy"],
      degraded:["badge-degraded","Degraded"], unhealthy:["badge-unhealthy","Unhealthy"],
      completed:["badge-completed","Completed"], partial:["badge-partial","Partial"],
      pending_external:["badge-pending","Pending external"], failed:["badge-failed","Failed"],
      active:["badge-healthy","Active"], deactivated:["badge-draft","Deactivated"]
    };
    var m=map[s]||["badge-neutral",s];
    return '<span class="badge '+m[0]+'"><span class="dot"></span>'+esc(m[1])+'</span>';
  }
  function appById(id){ for(var i=0;i<DB.apps.length;i++){ if(DB.apps[i].id===id) return DB.apps[i]; } return null; }

  /* ======================= toast ======================= */
  function toast(title,text,kind){
    var root=$("#toast-root");
    var el=document.createElement("div");
    el.className="toast "+(kind||"ok");
    el.innerHTML=icon(kind==="err"?"i-alert":"i-check")+'<div><b>'+esc(title)+'</b>'+(text?'<span class="tx">'+esc(text)+'</span>':"")+'</div>';
    root.appendChild(el);
    setTimeout(function(){
      el.style.transition="opacity .2s ease,transform .2s ease";
      el.style.opacity="0"; el.style.transform="translateY(8px)";
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },220);
    },3800);
  }

  /* ======================= overlay (modal / drawer) ======================= */
  var lastFocus=null;
  function openModal(cfg){
    lastFocus=document.activeElement;
    var root=$("#modal-root");
    var mid="modal-title-"+(cfg.key||"x");
    root.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="'+mid+'">'+
      '<div class="modal-head">'+(cfg.icon?'<span class="icon-tile '+(cfg.tone||"it-teal")+'">'+icon(cfg.icon)+'</span>':"")+
      '<div class="od-fill"><h2 id="'+mid+'">'+esc(cfg.title)+'</h2>'+(cfg.sub?'<div class="sub">'+esc(cfg.sub)+'</div>':"")+'</div>'+
      '<button class="icon-btn" data-action="close-overlay" aria-label="Close dialog">'+icon("i-x")+'</button></div>'+
      '<div class="modal-body">'+cfg.body+'</div>'+
      (cfg.footer?'<div class="modal-foot">'+cfg.footer+'</div>':"")+
    '</div>';
    root.setAttribute("aria-hidden","false");
    requestAnimationFrame(function(){
      var m=$(".modal",root); if(m) m.classList.add("on");
      var f=root.querySelector("[data-autofocus]")||root.querySelector("button, input, select, textarea, a[href]");
      if(f) f.focus();
    });
    $("#scrim").classList.add("on");
  }
  function syncScrim(){
    var on=$(".modal.on") || $(".drawer.on");
    $("#scrim").classList.toggle("on", !!on);
  }
  function closeModal(){
    var root=$("#modal-root");
    var m=$(".modal",root);
    if(m) m.classList.remove("on");
    root.setAttribute("aria-hidden","true");
    setTimeout(function(){ root.innerHTML=""; },180);
    syncScrim();
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function openDrawer(html){
    lastFocus=document.activeElement;
    var root=$("#drawer-root");
    root.innerHTML='<aside class="drawer" role="dialog" aria-modal="true" aria-label="Detail">'+html+'</aside>';
    var d=$(".drawer",root);
    requestAnimationFrame(function(){ d.classList.add("on"); var f=d.querySelector("[data-autofocus]")||d.querySelector("button"); if(f) f.focus(); });
    $("#scrim").classList.add("on");
  }
  function closeDrawer(){
    var root=$("#drawer-root"); var d=$(".drawer",root);
    if(d) d.classList.remove("on");
    setTimeout(function(){ root.innerHTML=""; },240);
    syncScrim();
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function closeAllOverlays(){ closeModal(); closeDrawer(); }

  function toggleSidebar(force){
    var sb=$("#sidebar");
    var open = force==null ? !sb.classList.contains("open") : force;
    sb.classList.toggle("open",open);
    $(".hamburger").setAttribute("aria-expanded",String(open));
  }
  function closeSidebar(){ toggleSidebar(false); }

  /* ======================= routing ======================= */
  var ROUTES = {
    "#/dashboard":{title:"Dashboard",render:renderDashboard},
    "#/apps":{title:"Apps",render:renderApps},
    "#/submissions":{title:"Submissions",render:renderSubmissions},
    "#/connectors":{title:"Connectors",render:renderConnectors},
    "#/audit":{title:"Audit Log",render:renderAudit},
    "#/users":{title:"User Management",render:renderUsers},
    "#/settings":{title:"Settings",render:renderSettings}
  };
  var ui={ appFilter:"all", appQuery:"", editorTab:"general", subStatus:"all", subQuery:"", auditQuery:"", userQuery:"" };

  function parseHash(){
    var raw=(location.hash||"#/dashboard").replace(/^#/,"");
    var parts=raw.split("?");
    var path="#/"+parts[0].replace(/^\//,"");
    var q={};
    if(parts[1]){ parts[1].split("&").forEach(function(p){ var kv=p.split("="); if(kv[0]) q[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||""); }); }
    return {path:path,q:q};
  }
  function navigate(hash){ if(location.hash===hash){ route(); } else { location.hash=hash; } }

  function route(){
    var r=parseHash();
    var v=$("#main");
    var html,title;
    if(r.path.indexOf("#/apps/")===0 && r.path.length>7){
      var id=r.path.slice(7);
      var app=appById(id);
      if(!app){ html=notFound(); title="Apps"; }
      else {
        if(r.q.tab) ui.editorTab=r.q.tab;
        else if(ui.lastAppId!==id) ui.editorTab="general";
        ui.lastAppId=id;
        html=renderAppEditor(app); title=app.name;
      }
    } else if(ROUTES[r.path]){
      ui.lastAppId=null;
      title=ROUTES[r.path].title;
      html=ROUTES[r.path].render();
    } else { html=notFound(); title="Not found"; }
    v.innerHTML=html;
    document.title=title+" · App Builder Console";
    $("#crumbs").innerHTML='<b>'+esc(title)+'</b>';
    $$(".nav-item").forEach(function(b){
      var rt=b.getAttribute("data-route");
      var cur = rt===r.path || (rt==="#/apps" && r.path.indexOf("#/apps")===0);
      if(cur) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    closeSidebar();
    window.scrollTo(0,0);
  }

  function notFound(){
    return '<div class="empty">'+icon("i-search")+'<h3>Page not found</h3><p>The view you requested does not exist in this prototype.</p>'+

  }

  /* ======================= render: apps ======================= */
  function renderApps(){

      return true;

    var filters=[["all","All"],["published","Published"],["draft","Draft"],["deprecated","Deprecated"],["archived","Archived"]];
    return '<div class="page-head">'+
      '<div class="titles"><h1>Apps</h1><p class="sub">Self-contained mini-apps you own or manage. Open one to edit triggers, RBAC, forms, and routing.</p></div>'+

    '</div>'+
    '<div class="toolbar">'+
      '<div class="rail" style="flex:1" role="group" aria-label="Filter by status">'+
        filters.map(function(f){ return '<button class="chip" data-action="app-filter" data-value="'+f[0]+'" aria-pressed="'+(ui.appFilter===f[0])+'">'+f[1]+'</button>'; }).join("")+
      '</div>'+
      '<div class="search" style="width:250px"><label class="sr" for="app-search">Filter apps</label>'+
        '<input id="app-search" type="search" placeholder="Filter apps…" value="'+esc(ui.appQuery)+'" data-field="appQuery" />'+icon("i-search")+'</div>'+

      '<div class="card"><div class="empty">'+icon("i-apps")+'<h3>No apps match</h3><p>Try a different status filter or clear the search.</p>'+
      '<button class="btn" data-action="app-filter" data-value="all">Clear filters</button></div></div>');

  /* ======================= render: app editor ======================= */
  function renderAppEditor(app){

      '<div class="titles"><div class="od-row" style="--od-gap:10px;margin-bottom:8px">'+
        '<button class="icon-btn" data-action="nav" data-route="#/apps" aria-label="Back to apps">'+icon("i-arrow-left")+'</button>'+
        '<span class="pill-mono">'+esc(app.id)+'</span>'+statusBadge(app.status)+'<span class="pill-mono">v'+app.version+'</span></div>'+
        '<h1>'+esc(app.name)+'</h1><p class="sub">'+esc(app.desc)+'</p></div>'+
      '<div class="page-actions">'+
        '<button class="btn" data-action="preview-app" data-id="'+esc(app.id)+'">'+icon("i-eye")+'Preview</button>'+

      '</div>'+

      ["purge_after_days","Purge after N days","Soft-delete first, hard-delete after a 30-day grace period."],

      '<div class="od-stack" style="--od-gap:18px">'+

          '<div class="step-rail" style="margin-bottom:18px">'+states.map(function(s,i){
            var cls=i<cur?"done":(i===cur?"now":"todo");
            return (i?'<span class="step-line"></span>':"")+'<span class="step '+cls+'"><span class="dot">'+(i<cur?"✓":(i+1))+'</span><span class="lbl">'+s.charAt(0).toUpperCase()+s.slice(1)+'</span></span>';
          }).join("")+'</div>'+
          '<div class="callout '+(a.status==="archived"?"callout-info":"callout-accent")+'">'+icon("i-info")+'<div>'+
            (a.status==="draft"?"Draft forms are not reachable by any link or trigger. Publish to register triggers and create indexes.":
             a.status==="published"?"Deprecating shows a notice and stops new trigger registration while keeping the app functional.":
             a.status==="deprecated"?"Archiving makes the app read-only; existing view links keep working.":
             a.status==="archived"?"Archived apps are read-only. Purge soft-deletes, then hard-deletes after 30 days.":
             "Purged app data has been hard-deleted per policy.")+
          '</div></div>'+
          '<div class="od-row" style="--od-gap:10px;flex-wrap:wrap">'+
            (a.status==="published"?'<button class="btn btn-sm" data-action="lifecycle" data-id="'+esc(a.id)+'" data-to="deprecated">Deprecate</button>':"")+
            (a.status==="deprecated"?'<button class="btn btn-sm" data-action="lifecycle" data-id="'+esc(a.id)+'" data-to="archived">Archive</button>':"")+
            (a.status==="archived"?'<button class="btn btn-sm btn-danger" data-action="lifecycle" data-id="'+esc(a.id)+'" data-to="purged">'+icon("i-trash")+'Purge</button>':"")+
            (a.status==="draft"?'<button class="btn btn-sm btn-primary" data-action="publish-app" data-id="'+esc(a.id)+'">'+icon("i-bolt")+'Publish now</button>':"")+
          '</div>'+
        '</div></section>'+
        '<section class="card"><div class="card-head"><h2>Retention policy</h2></div><div class="card-body"><div class="od-stack" style="--od-gap:10px">'+
          retention.map(function(r){
            return '<label class="radio-card '+(a.retention.mode===r[0]?"sel":"")+'"><input type="radio" name="ret-'+esc(a.id)+'" '+(a.retention.mode===r[0]?"checked":"")+' data-action="set-retention" data-id="'+esc(a.id)+'" data-value="'+r[0]+'" />'+
              '<span><span class="rc-t">'+esc(r[1])+'</span><span class="rc-d">'+esc(r[2])+'</span></span></label>';
          }).join("")+'</div>'+
          (a.retention.mode==="purge_after_days"?'<div class="field" style="margin-top:16px;max-width:240px"><label for="ret-days">Retention period (days)</label><input id="ret-days" class="input" type="number" value="'+(a.retention.days||365)+'" /></div>':"")+
          '<label class="switch" style="margin-top:8px"><input type="checkbox" /><span class="track"></span>Export to JSON Lines before purge</label>'+
        '</div></section>'+
      '</div>'+
      '<section class="card"><div class="card-head"><h2>Deprecation notice</h2></div><div class="card-body">'+
        '<div class="field"><label for="dep-note">User-facing notice</label>'+
          '<textarea id="dep-note" class="textarea" placeholder="Shown to users in chat while the app is deprecated.">'+esc(a.deprecation)+'</textarea></div>'+
        '<div class="callout callout-warn">'+icon("i-alert")+'<div>Purge operations are written to the immutable audit trail with operator ID and timestamp.</div></div>'+
      '</div></section>'+
    '</div>';

  /* ======================= render: submissions ======================= */
  function renderSubmissions(){

    return '<div class="page-head">'+
      '<div class="titles"><h1>Submissions</h1><p class="sub">Immutable records of every form submission. Each maps to a real user and a trace ID.</p></div>'+

    '</div>'+

  function openPublish(id){
    var a=appById(id); if(!a) return;
    var changes=[];
    if(a.status==="draft"){ changes.push(["Status","draft","published"]); }
    changes.push(["App version","v"+a.version,"v"+(a.version+1)]);
    changes.push(["Form versions","current","pinned at link creation"]);
    if(a.data.collections.length) changes.push(["Indexes","—","creation on "+a.data.collections.map(function(c){return c.name;}).join(", ")]);
    changes.push(["Triggers",a.triggers.length? "registered":"none", a.triggers.length? (a.triggers.length+" active"):"none registered"]);
    var list=changes.map(function(c){
      return '<div class="od-row" style="justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">'+
        '<span class="od-fill" style="font-size:14px">'+esc(c[0])+'</span>'+
        '<span class="cell-mono">'+esc(c[1])+'</span><span style="color:var(--muted)">'+icon("i-chevron")+'</span>'+
        '<span class="cell-mono cell-strong">'+esc(c[2])+'</span></div>';
    }).join("");
    openModal({
      key:"publish", icon:"i-bolt", tone:"it-teal",
      title:"Publish “"+a.name+"”?", sub:"Review the changes that take effect immediately.",
      body:'<div>'+list+'</div>'+
        '<div class="callout callout-accent" style="margin-top:16px">'+icon("i-info")+
        '<div>Publishing registers triggers and creates declared indexes. This action is versioned and written to the audit trail.</div></div>',
      footer:'<button class="btn" data-action="close-overlay">Cancel</button>'+
        '<button class="btn btn-primary" data-action="confirm-publish" data-id="'+esc(a.id)+'" data-autofocus>'+icon("i-bolt")+'Confirm publish</button>'

  function openFormPreview(appId, formId){
    var a=appById(appId); if(!a) return;
    var def=fieldDef(formId);
    var fields=def.fields.map(function(f,i){
      var id="pf-"+f.name;
      var input;
      if(f.type==="textarea") input='<textarea id="'+id+'" class="textarea" data-pf="'+esc(f.name)+'" data-required="'+(!!f.required)+'"></textarea>';
      else if(f.type==="select") input='<select id="'+id+'" class="select" data-pf="'+esc(f.name)+'" data-required="'+(!!f.required)+'"><option value="">Select…</option>'+f.options.map(function(o){return '<option>'+esc(o)+'</option>';}).join("")+'</select>';
      else if(f.type==="date") input='<input id="'+id+'" class="input" type="date" data-pf="'+esc(f.name)+'" data-required="'+(!!f.required)+'" />';
      else if(f.type==="number") input='<input id="'+id+'" class="input" type="number" data-pf="'+esc(f.name)+'" data-required="'+(!!f.required)+'" />';
      else if(f.type==="file") input='<input id="'+id+'" class="input" type="file" data-pf="'+esc(f.name)+'" data-required="false" />';
      else input='<input id="'+id+'" class="input" type="text" value="'+esc(f.value||"")+'" '+(f.readonly?"readonly":"")+' data-pf="'+esc(f.name)+'" data-required="'+(!!f.required)+'" />';
      return '<div class="field"><label for="'+id+'">'+esc(f.label)+(f.required?'<span class="req">*</span>':'')+(f.readonly?' <span class="helper" style="font-weight:400">· pre-filled from profile</span>':'')+'</label>'+
        input+(f.helper?'<span class="helper">'+esc(f.helper)+'</span>':'')+
        '<span class="error-text" hidden></span></div>';
    }).join("");
    openModal({
      key:"preview", icon:"i-form", tone:"it-teal",
      title:def.title, sub:"FormIO.js renderer preview · "+a.name+" · in-progress drafts are not reachable by links",
      body:'<div id="form-preview-root">'+fields+
        '<div id="pf-success" hidden><div class="callout callout-accent">'+icon("i-check")+
          '<div><b>Submitted.</b> Submission <span class="code-inline">sub_preview_001</span> validated and routed. In the real system this opens from a one-time signed link and consumes the token atomically.</div></div></div>'+
      '</div>',
      footer:'<button class="btn" data-action="close-overlay">Close</button>'+
        '<button class="btn" data-action="reset-preview">Reset</button>'+
        '<button class="btn btn-primary" data-action="submit-preview" data-id="'+esc(appId)+'">'+icon("i-check")+'Submit preview</button>'
    });
  }

    var c=null; DB.connectors.forEach(function(x){ if(x.id===id) c=x; });

    openModal({

        '<div>The platform calls the connector health endpoint and validates credentials. No side effects are produced (dry-run).</div></div></div>'+
        '<dl class="kv" style="margin-top:18px">'+
          '<dt>Type</dt><dd>'+esc(c.type)+'</dd>'+
          '<dt>Rate limit</dt><dd>'+c.rpm+' requests / min</dd>'+
          '<dt>Timeout</dt><dd>30 s</dd>'+
          '<dt>Managed by</dt><dd class="cell-mono">'+esc(c.manager)+'</dd>'+

        '<button class="btn btn-primary" data-action="run-connector-test" data-id="'+esc(c.id)+'" data-autofocus>'+icon("i-refresh")+'Run test</button>'
    });

  function openMappingModal(appId){
    var a=appById(appId); if(!a) return;

      key:"mapping", icon:"i-flow", tone:"it-teal",
      title:"Add field mapping", sub:"Map a form or profile value onto the connector payload.",

      footer:'<button class="btn" data-action="close-overlay">Cancel</button>'+
        '<button class="btn btn-primary" data-action="save-mapping" data-id="'+esc(appId)+'">Add mapping</button>'

    var a=appById(appId); if(!a) return;
    openModal({
      key:"transfer", icon:"i-users", tone:"it-amber",

          '<div>Ownership transfer requires global admin approval. Pending requests auto-cancel after 7 days. An app must always have exactly one owner.</div></div>'+
        '<div class="field" style="margin-top:18px"><label for="to-user">New owner<span class="req">*</span></label>'+
          '<input id="to-user" class="input" list="user-list2" placeholder="Search by name or email" data-autofocus />'+
          '<datalist id="user-list2">'+DB.users.map(function(u){return '<option value="'+esc(u.name)+' · '+esc(u.email)+'">'+esc(u.dept)+'</option>';}).join("")+'</datalist></div>'+
        '<div class="field"><label for="to-reason">Reason</label><textarea id="to-reason" class="textarea" placeholder="Optional context for the approver."></textarea></div>',
      footer:'<button class="btn" data-action="close-overlay">Cancel</button>'+
        '<button class="btn btn-primary" data-action="confirm-transfer" data-id="'+esc(appId)+'">Submit request</button>'
    });

  /* ======================= interactions ======================= */
  function validatePreview(){
    var root=$("#form-preview-root"); if(!root) return true;
    var ok=true, firstBad=null;
    $$("[data-pf]",root).forEach(function(el){
      var wrap=el.closest(".field");
      var err=wrap? wrap.querySelector(".error-text") : null;
      var req=el.getAttribute("data-required")==="true";
      var val=(el.value||"").trim();
      var bad=req && !val;
      el.classList.toggle("invalid",bad);
      if(err){
        if(bad){ err.hidden=false; err.innerHTML=icon("i-alert")+"<span>This field is required.</span>"; if(!firstBad) firstBad=el; ok=false; }
        else { err.hidden=true; err.innerHTML=""; }
      }
    });
    if(firstBad) firstBad.focus();
    return ok;
  }

  function doPublish(id){
    var a=appById(id); if(!a) return;
    if(a.status==="draft") a.status="published";
    a.version=a.version+1;
    a.updated=new Date().toISOString();
    DB.audit.unshift({ts:a.updated, actor:"usr_42 · An Nguyen", action:"app.publish", target:a.id, app:a.id, prev:"version:"+(a.version-1), next:"version:"+a.version+",status:published", ip:"10.0.1.55"});
    closeAllOverlays();
    toast("App published","v"+a.version+" · triggers registered, indexes created");
    route();
  }

  document.addEventListener("click", function(e){
    var el=e.target.closest("[data-action]");
    if(!el) return;
    var action=el.getAttribute("data-action");
    var id=el.getAttribute("data-id");
    switch(action){
      case "nav": navigate(el.getAttribute("data-route")); break;
      case "toggle-nav": toggleSidebar(); break;
      case "open-app": navigate("#/apps/"+id); break;
      case "editor-tab": ui.editorTab=el.getAttribute("data-tab"); route(); break;
      case "app-filter": ui.appFilter=el.getAttribute("data-value"); route(); break;
      case "sub-filter": ui.subStatus=el.getAttribute("data-value"); route(); break;

      case "publish-app": openPublish(id); break;
      case "confirm-publish": doPublish(id); break;
      case "save-app": toast("Draft saved","Changes stored to the app definition · not yet published"); break;
      case "preview-app": navigate("#/apps/"+id+"?tab=forms"); toast("Preview mode","Open a form below to preview the FormIO.js renderer"); break;
      case "preview-form": openFormPreview(id, el.getAttribute("data-form")); break;
      case "open-builder": toast("Form builder","FormIO.js drag-and-drop builder opens here in the full product"); break;

      case "add-trigger": {
        var app=appById(id);
        if(app){ app.triggers.push({type:"intent", intent:"new_intent", examples:["Example phrase"]}); route(); toast("Trigger added","Edit the intent name and example phrases"); }
        break;
      }
      case "remove-trigger": {
        var app2=appById(id);
        if(app2){ app2.triggers.splice(parseInt(el.getAttribute("data-i"),10),1); route(); toast("Trigger removed"); }
        break;
      }
      case "assign-user": {
        var app3=appById(id);
        var val=$("#rb-search") ? $("#rb-search").value.trim() : "";
        var roleEl=$("#rb-role"); var role=roleEl? roleEl.value : "";
        if(!val){ toast("Nothing to assign","Enter a user name or email first", "err"); break; }
        if(app3){
          var found=null;
          for(var i=0;i<app3.assignments.length;i++){ if(app3.assignments[i].role===role){ found=app3.assignments[i]; break; } }
          if(!found){ found={role:role, users:[], count:0}; app3.assignments.push(found); }
          found.users.push(val); found.count++;
          toast("User assigned", val+" → "+role);
          route();
        }
        break;
      }
      case "bulk-assign": toast("Bulk assignment","Upload a CSV of real_user_ids and roles to assign in bulk"); break;
      case "edit-assignment": toast("Manage assignment","Role editor opens here in the full product"); break;
      case "add-mapping": openMappingModal(id); break;
      case "save-mapping": {
        var app4=appById(id);
        var from=$("#mp-from")?$("#mp-from").value.trim():"";
        var to=$("#mp-to")?$("#mp-to").value.trim():"";
        var tr=$("#mp-tr")?$("#mp-tr").value:"direct";
        if(from && to && app4){ app4.data.mapping.push({from:from,to:to,transform:tr}); closeAllOverlays(); toast("Mapping added", from+" → "+to); route(); }
        else toast("Mapping incomplete","Provide both a source and a destination", "err");
        break;
      }
      case "set-mode": {
        var app5=appById(id);
        if(app5){ app5.data.mode=el.getAttribute("data-value"); route(); toast("Data mode set", app5.data.mode); }
        break;
      }
      case "set-retention": {
        var app6=appById(id);
        if(app6){ app6.retention.mode=el.getAttribute("data-value"); route(); }
        break;
      }
      case "lifecycle": {
        var app7=appById(id); var to=el.getAttribute("data-to");
        if(app7){
          app7.status=to;
          DB.audit.unshift({ts:new Date().toISOString(), actor:"usr_42 · An Nguyen", action:"app."+(to==="purged"?"purge":to), target:app7.id, app:app7.id, prev:"status", next:"status:"+to, ip:"10.0.1.55"});
          toast("Lifecycle updated", app7.name+" → "+to);
          route();
        }
        break;
      }
      case "transfer-owner": openTransferOwner(id); break;
      case "confirm-transfer": closeAllOverlays(); toast("Transfer requested","Awaiting global admin approval · auto-cancels in 7 days"); break;

      case "view-submission": openSubmission(id); break;
      case "retry-submission": {
        var s=null; DB.submissions.forEach(function(x){ if(x.id===id) s=x; });
        if(s){ s.status="pending_external"; s.external.status="retrying · attempt 1/5"; closeAllOverlays(); toast("Retry queued","External call re-enqueued with exponential backoff"); route(); }
        break;
      }

      case "test-connector": openConnectorTest(id); break;
      case "run-connector-test": {
        var btn=el; btn.classList.add("is-loading");
        var result=$("#conn-test-result");
        setTimeout(function(){
          btn.classList.remove("is-loading");
          var c=null; DB.connectors.forEach(function(x){ if(x.id===id) c=x; });
          if(!c) return;
          var ok=c.status==="healthy";
          if(result){
            result.innerHTML='<div class="callout '+(ok?"callout-accent":(c.status==="degraded"?"callout-warn":"callout-danger"))+'">'+icon(ok?"i-check":"i-alert")+
              '<div><b>'+(ok?"Healthy":(c.status==="degraded"?"Degraded":"Unreachable"))+'.</b> '+
              (ok?("Responded in "+c.p95+" ms · credentials valid."):(c.status==="degraded"?("Responded in "+c.p95+" ms · slower than the 1000 ms target."):"No response within the 30 s timeout. Last success 4 h ago."))+'</div></div>';
          }
          toast(ok?"Connection healthy":"Connection problem", c.name+(ok?" responded normally":" needs attention"), ok?"ok":"err");
        },850);
        break;
      }
      case "new-connector": openNewConnector(); break;
      case "create-connector": {
        var nm=$("#nc-name")?$("#nc-name").value.trim():"";
        if(!nm){ toast("Name required","Give the connector a display name", "err"); break; }
        closeAllOverlays();
        toast("Connector registered", nm+" · health check scheduled");
        break;
      }

      case "new-app": openNewApp(); break;
      case "create-app": {
        var an=$("#na-name")?$("#na-name").value.trim():"";
        if(!an){ toast("App name required","Enter a name to continue", "err"); break; }
        closeAllOverlays();
        toast("App created","Saved as a draft · continue through the wizard steps");
        navigate("#/apps/asset-request");
        break;
      }
      case "import-csv": toast("CSV import","Upload employee emails and chat IDs to pre-provision mappings"); break;
      case "map-user": toast("Map user","Create a chat_user_id → real_user_id mapping"); break;
      case "export": toast("Export started","A download will be prepared in your browser"); break;
      case "save-settings": toast("Settings saved","JEV chain and defaults updated"); break;

      case "close-overlay": closeAllOverlays(); break;
      case "reset-preview": {
        var proot=$("#form-preview-root"); if(proot){
          $$("[data-pf]",proot).forEach(function(f){
            if(f.tagName==="SELECT" || f.tagName==="INPUT"){ f.value=""; }
            else if(f.tagName==="TEXTAREA"){ f.value=""; }
            f.classList.remove("invalid");
            var w=f.closest(".field"); var er=w?w.querySelector(".error-text"):null;
            if(er){ er.hidden=true; er.innerHTML=""; }
          });
          var sc=$("#pf-success"); if(sc) sc.hidden=true;
          var f0=$("[data-pf]",proot); if(f0) f0.focus();
        }
        break;
      }

      case "submit-preview": {
        if(!validatePreview()){ toast("Please fix the errors","Required fields are highlighted", "err"); break; }
        var succ=$("#pf-success"); if(succ) succ.hidden=false;
        var root=$("#form-preview-root"); if(root) root.scrollIntoView({block:"start"});
        toast("Form submitted","Validation passed · routing simulated");
        break;
      }
      default: break;
    }
  });

  document.addEventListener("input", function(e){
    var t=e.target;
    if(t && t.getAttribute && t.getAttribute("data-field")){
      var f=t.getAttribute("data-field");
      ui[f]=t.value;
      clearTimeout(window.__filterTimer);
      window.__filterTimer=setTimeout(function(){ var pos=t.selectionStart; route(); var again=$('[data-field="'+f+'"]'); if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(err){} } },220);
    }
  });

  document.addEventListener("blur", function(e){
    var t=e.target;
    if(t && t.getAttribute && t.getAttribute("data-pf") && t.getAttribute("data-required")==="true"){
      var wrap=t.closest(".field"); var err=wrap?wrap.querySelector(".error-text"):null;
      var bad=!(t.value||"").trim();
      t.classList.toggle("invalid",bad);
      if(err){ err.hidden=!bad; err.innerHTML=bad?(icon("i-alert")+"<span>This field is required.</span>"):""; }
    }
  }, true);

  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ if($("#modal-root").firstChild || $("#drawer-root").firstChild){ closeAllOverlays(); } }
  });

  $("#scrim").addEventListener("click", closeAllOverlays);

  $("#global-search").addEventListener("keydown", function(e){
    if(e.key==="Enter"){
      var v=e.target.value.trim();
      ui.appQuery=v; ui.subQuery=v; ui.userQuery=v;
      navigate("#/apps");
      toast("Searching", v?('Results for “'+v+'”'):"Cleared");
    }
  });

  window.addEventListener("hashchange", route);
  route();
})();
</script>
